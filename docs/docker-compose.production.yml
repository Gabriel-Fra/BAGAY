# BAGAY reference deployment (single barangay, single small VM or a municipal server)
# docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bagay
      POSTGRES_USER: bagay_owner
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro      # 001_event_store.sql, 002_read_models.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bagay_owner -d bagay"]
      interval: 10s

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: bagay
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASSWORD}
    ports: ["15672:15672"]                      # management UI (restrict in production)
    volumes: [rmqdata:/var/lib/rabbitmq]

  minio:                                        # content-addressed photo store
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: bagay
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes: [blobs:/data]

  command-api:                                  # Java 21 + Spring Boot: validates commands, hashes, appends
    build: ./services/command-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bagay
      DB_USER: bagay_writer_login
      JWT_ISSUER: https://bagay.example
    depends_on: [postgres]

  relay:                                        # Java: LISTEN bagay_events -> publish with confirms
    build: ./services/relay
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bagay
      AMQP_URL: amqp://bagay:${RMQ_PASSWORD}@rabbitmq:5672
    depends_on: [postgres, rabbitmq]

  query-api:                                    # Python 3.12 + FastAPI: projections, verify, exports
    build: ./services/query-api
    environment:
      DATABASE_URL: postgresql://bagay_reader_login@postgres/bagay
    depends_on: [postgres]

  projectors:                                   # Python workers: registry, timeline, inbox, work queue, hazard
    build: ./services/projectors
    environment:
      DATABASE_URL: postgresql://bagay_projector_login@postgres/bagay
      AMQP_URL: amqp://bagay:${RMQ_PASSWORD}@rabbitmq:5672
    deploy: { replicas: 1 }                     # one instance per projector keeps ordering simple
    depends_on: [postgres, rabbitmq]

  insights:                                     # Python + pandas: reliability scores every 15 min
    build: ./services/insights
    depends_on: [postgres]

  witness:                                      # Python: daily checkpoints, signs, emails C/MLGOO, prints slip
    build: ./services/witness
    environment:
      SIGNING_KEY_FILE: /run/secrets/ed25519
      WITNESS_EMAILS: ${WITNESS_EMAILS}
    secrets: [ed25519]
    depends_on: [postgres]

  web:                                          # React + TypeScript PWA served by Caddy (TLS, gateway)
    build: ./web
    ports: ["443:443", "80:80"]
    depends_on: [command-api, query-api]

volumes: { pgdata: {}, rmqdata: {}, blobs: {} }
secrets:
  ed25519: { file: ./secrets/ed25519.key }
