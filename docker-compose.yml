# Optional services for the next step (the demo itself needs none of this).
#   docker compose up -d postgres
#   export BAGAY_DB=postgresql://bagay:bagay@localhost:5432/bagay
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bagay
      POSTGRES_USER: bagay
      POSTGRES_PASSWORD: bagay
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: bagay
      RABBITMQ_DEFAULT_PASS: bagay
    ports: ["5672:5672", "15672:15672"]

volumes:
  pgdata:
